<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">career-agent-guard architecture</title>
  <desc id="desc">Four columns show input sources, the policy layer, execution adapters, and verification outputs.</desc>
  <defs>
    <linearGradient id="arch-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1726"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#6EA8FE"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#arch-bg)"/>
  <path d="M48 92H1152M48 510H1152" stroke="#31506b" stroke-width="1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="52" y="58" font-size="26" font-weight="700" fill="#F5F7FA">One policy spine, multiple tools</text>
    <text x="52" y="80" font-size="15" fill="#A6B3C5">数据可以来自不同平台；判断、授权和核验不能各自为政。</text>

    <g transform="translate(52 126)">
      <text x="0" y="0" font-size="15" letter-spacing="2" fill="#45D6C6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01 / INPUTS</text>
      <rect y="24" width="220" height="78" rx="14" fill="#10283A" stroke="#45D6C6"/>
      <text x="20" y="56" font-size="20" font-weight="600" fill="#F5F7FA">Candidate Profile</text>
      <text x="20" y="82" font-size="14" fill="#A6B3C5">facts · targets · consent</text>
      <rect y="120" width="220" height="78" rx="14" fill="#10283A" stroke="#45D6C6"/>
      <text x="20" y="152" font-size="20" font-weight="600" fill="#F5F7FA">Job Sources</text>
      <text x="20" y="178" font-size="14" fill="#A6B3C5">CLI · Excel · JD · web page</text>
      <rect y="216" width="220" height="78" rx="14" fill="#10283A" stroke="#45D6C6"/>
      <text x="20" y="248" font-size="20" font-weight="600" fill="#F5F7FA">Evidence</text>
      <text x="20" y="274" font-size="14" fill="#A6B3C5">source · field · fingerprint</text>
    </g>

    <g transform="translate(334 126)">
      <text x="0" y="0" font-size="15" letter-spacing="2" fill="#F4B860" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02 / GUARD</text>
      <rect y="24" width="270" height="294" rx="16" fill="#1B2636" stroke="#F4B860" stroke-width="2"/>
      <path d="M28 88H242M28 154H242M28 220H242" stroke="#40566E"/>
      <circle cx="44" cy="57" r="10" fill="#F4B860"/>
      <circle cx="44" cy="123" r="10" fill="#6EA8FE"/>
      <circle cx="44" cy="189" r="10" fill="#75E0A3"/>
      <circle cx="44" cy="255" r="10" fill="#FF7B72"/>
      <g fill="#F5F7FA" font-size="18" font-weight="600">
        <text x="68" y="64">Normalize</text>
        <text x="68" y="130">Hard Gates</text>
        <text x="68" y="196">Decision</text>
        <text x="68" y="262">Action Gate</text>
      </g>
      <g fill="#A6B3C5" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="68" y="83">make records comparable</text>
        <text x="68" y="149">PASS / REJECT / HOLD</text>
        <text x="68" y="215">evidence + uncertainty</text>
        <text x="68" y="281">exact job + message + approval</text>
      </g>
    </g>

    <g transform="translate(664 126)">
      <text x="0" y="0" font-size="15" letter-spacing="2" fill="#6EA8FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03 / ADAPTERS</text>
      <rect y="24" width="220" height="78" rx="14" fill="#142840" stroke="#6EA8FE"/>
      <text x="20" y="56" font-size="19" font-weight="600" fill="#F5F7FA">boss-agent-cli</text>
      <text x="20" y="82" font-size="14" fill="#A6B3C5">search · cache · shortlist</text>
      <rect y="120" width="220" height="78" rx="14" fill="#142840" stroke="#6EA8FE"/>
      <text x="20" y="152" font-size="19" font-weight="600" fill="#F5F7FA">BOSS Bridge</text>
      <text x="20" y="178" font-size="14" fill="#A6B3C5">Edge page control</text>
      <rect y="216" width="220" height="78" rx="14" fill="#142840" stroke="#6EA8FE"/>
      <text x="20" y="248" font-size="19" font-weight="600" fill="#F5F7FA">BossHelper</text>
      <text x="20" y="274" font-size="14" fill="#A6B3C5">page adapter · chat</text>
    </g>

    <g transform="translate(936 126)">
      <text x="0" y="0" font-size="15" letter-spacing="2" fill="#75E0A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04 / PROOF</text>
      <rect y="24" width="212" height="78" rx="14" fill="#12322D" stroke="#75E0A3"/>
      <text x="18" y="56" font-size="19" font-weight="600" fill="#F5F7FA">Verified Result</text>
      <text x="18" y="82" font-size="14" fill="#A6B3C5">visible platform evidence</text>
      <rect y="120" width="212" height="78" rx="14" fill="#12322D" stroke="#75E0A3"/>
      <text x="18" y="152" font-size="19" font-weight="600" fill="#F5F7FA">Audit Receipt</text>
      <text x="18" y="178" font-size="14" fill="#A6B3C5">decision · action · proof</text>
      <rect y="216" width="212" height="78" rx="14" fill="#3B2428" stroke="#FF7B72"/>
      <text x="18" y="248" font-size="19" font-weight="600" fill="#F5F7FA">HOLD / BLOCK</text>
      <text x="18" y="274" font-size="14" fill="#A6B3C5">stop with a reason</text>
    </g>

    <g fill="none" stroke="#6EA8FE" stroke-width="2" marker-end="url(#arrow)">
      <path d="M274 190H320"/>
      <path d="M604 190H650"/>
      <path d="M884 190H922"/>
    </g>
    <path d="M604 458H1050" stroke="#FF7B72" stroke-width="2" stroke-dasharray="7 8"/>
    <text x="604" y="484" font-size="15" fill="#FFB1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">uncertain, unsafe, or unverifiable → stop</text>
    <text x="52" y="542" font-size="14" fill="#7891A8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">The adapters execute; the Guard decides whether execution is allowed.</text>
  </g>
</svg>
